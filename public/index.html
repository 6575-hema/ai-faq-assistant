<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI FAQ Assistant</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --card: #ffffff;
      --text: #1d2433;
      --muted: #6b7385;
      --border: #e2e6ef;
      --primary: #3b5bdb;
      --primary-text: #ffffff;
      --user-bubble: #3b5bdb;
      --bot-bubble: #eef1f8;
      --error: #c92a2a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --card: #1b2029;
        --text: #e6e9f0;
        --muted: #98a0b3;
        --border: #2c3340;
        --primary: #5c7cfa;
        --user-bubble: #4263eb;
        --bot-bubble: #252b37;
        --error: #ff6b6b;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px;
    }
    header .inner, main { max-width: 820px; margin: 0 auto; }
    h1 { margin: 0; font-size: 1.25rem; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
    nav { display: flex; gap: 8px; margin-top: 12px; }
    nav button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    nav button.active { background: var(--primary); color: var(--primary-text); border-color: var(--primary); }
    main { padding: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .hidden { display: none; }

    #messages {
      height: 55vh;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-bottom: 8px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .msg.user { align-self: flex-end; background: var(--user-bubble); color: #fff; }
    .msg.bot { align-self: flex-start; background: var(--bot-bubble); }
    .msg.error { align-self: flex-start; color: var(--error); background: transparent; border: 1px solid var(--error); }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
    .suggestions button {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    form.row { display: flex; gap: 8px; }
    input, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    button.primary {
      background: var(--primary);
      color: var(--primary-text);
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
    }
    button.primary:disabled { opacity: 0.6; cursor: wait; }

    label { display: block; font-size: 0.9rem; margin: 12px 0 4px; color: var(--muted); }
    .status { margin-top: 10px; font-size: 0.9rem; }
    .status.ok { color: #2f9e44; }
    .status.err { color: var(--error); }
    h2 { font-size: 1.05rem; margin: 0 0 4px; }
    .faq-list { list-style: none; padding: 0; margin: 0; }
    .faq-list li { border-top: 1px solid var(--border); padding: 12px 0; }
    .faq-list li:first-child { border-top: none; }
    .faq-q { font-weight: 600; }
    .faq-a { color: var(--muted); margin-top: 4px; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid var(--border);
      color: var(--muted);
      margin-top: 6px;
    }
    .stack { display: grid; gap: 16px; }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1>AI FAQ Assistant</h1>
      <p>Ask questions about company HR policies, answered by Gemini AI.</p>
      <nav>
        <button class="active" data-tab="chat">Ask a Question</button>
        <button data-tab="faqs">Manage FAQs</button>
      </nav>
    </div>
  </header>

  <main>
    <!-- Chat tab -->
    <section id="tab-chat" class="card">
      <div id="messages">
        <div class="msg bot">Hi! Ask me anything about working hours, leave, salary, WFH and more.</div>
      </div>
      <div class="suggestions">
        <button>What are the working hours?</button>
        <button>How many leaves do I get?</button>
        <button>Can I work from home?</button>
        <button>When is salary credited?</button>
      </div>
      <form id="chat-form" class="row">
        <input id="chat-input" placeholder="Type your question..." autocomplete="off" required />
        <button class="primary" type="submit">Send</button>
      </form>
    </section>

    <!-- FAQs tab -->
    <section id="tab-faqs" class="stack hidden">
      <div class="card">
        <h2>Add a new FAQ</h2>
        <form id="faq-form">
          <label for="faq-question">Question</label>
          <input id="faq-question" required />
          <label for="faq-answer">Answer</label>
          <textarea id="faq-answer" required></textarea>
          <label for="faq-category">Category (optional)</label>
          <input id="faq-category" placeholder="General HR" />
          <div style="margin-top: 12px;">
            <button class="primary" type="submit">Add FAQ</button>
          </div>
          <div id="faq-status" class="status"></div>
        </form>
      </div>
      <div class="card">
        <h2 id="faq-count">All FAQs</h2>
        <ul id="faq-list" class="faq-list"></ul>
      </div>
    </section>
  </main>

  <script>
    const escapeHtml = (text) =>
      text.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // Minimal formatting for AI answers: escape HTML, then support **bold**.
    const formatAnswer = (text) => escapeHtml(text).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

    // Tabs
    document.querySelectorAll('nav button').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('nav button').forEach((b) => b.classList.toggle('active', b === btn));
        document.getElementById('tab-chat').classList.toggle('hidden', btn.dataset.tab !== 'chat');
        document.getElementById('tab-faqs').classList.toggle('hidden', btn.dataset.tab !== 'faqs');
        if (btn.dataset.tab === 'faqs') loadFAQs();
      });
    });

    // Chat
    const messages = document.getElementById('messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = chatForm.querySelector('button');

    const addMessage = (html, type) => {
      const div = document.createElement('div');
      div.className = `msg ${type}`;
      div.innerHTML = html;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
      return div;
    };

    const ask = async (question) => {
      addMessage(escapeHtml(question), 'user');
      const thinking = addMessage('Thinking...', 'bot');
      sendBtn.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const data = await res.json();
        thinking.remove();
        if (data.success) {
          addMessage(formatAnswer(data.aiAnswer), 'bot');
        } else {
          addMessage(escapeHtml(data.error || data.message || 'Something went wrong.'), 'error');
        }
      } catch (err) {
        thinking.remove();
        addMessage('Could not reach the server. Is it running?', 'error');
      } finally {
        sendBtn.disabled = false;
        chatInput.focus();
      }
    };

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const question = chatInput.value.trim();
      if (!question) return;
      chatInput.value = '';
      ask(question);
    });

    document.querySelectorAll('.suggestions button').forEach((btn) => {
      btn.addEventListener('click', () => ask(btn.textContent));
    });

    // FAQs
    const faqList = document.getElementById('faq-list');
    const faqCount = document.getElementById('faq-count');
    const faqForm = document.getElementById('faq-form');
    const faqStatus = document.getElementById('faq-status');

    const loadFAQs = async () => {
      try {
        const res = await fetch('/api/faqs');
        const data = await res.json();
        faqCount.textContent = `All FAQs (${data.count})`;
        faqList.innerHTML = data.data
          .map(
            (faq) => `<li>
              <div class="faq-q">${escapeHtml(faq.question)}</div>
              <div class="faq-a">${escapeHtml(faq.answer)}</div>
              <span class="tag">${escapeHtml(faq.category || 'General HR')}</span>
            </li>`
          )
          .join('');
      } catch (err) {
        faqList.innerHTML = '<li class="status err">Could not load FAQs. Is the server running?</li>';
      }
    };

    faqForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        question: document.getElementById('faq-question').value.trim(),
        answer: document.getElementById('faq-answer').value.trim(),
      };
      const category = document.getElementById('faq-category').value.trim();
      if (category) body.category = category;

      try {
        const res = await fetch('/api/faqs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        if (data.success) {
          faqStatus.textContent = 'FAQ added successfully.';
          faqStatus.className = 'status ok';
          faqForm.reset();
          loadFAQs();
        } else {
          faqStatus.textContent = data.error || data.message;
          faqStatus.className = 'status err';
        }
      } catch (err) {
        faqStatus.textContent = 'Could not reach the server.';
        faqStatus.className = 'status err';
      }
    });
  </script>
</body>
</html>
